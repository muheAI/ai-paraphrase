<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI释义器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f7fa;padding:20px;font-family:system-ui;}
.box{max-width:700px;margin:0 auto;background:#fff;padding:30px;border-radius:14px;}
textarea{width:100%;height:140px;padding:12px;border:1px solid #b8d4f5;border-radius:8px;font-size:16px;margin:15px 0;}
#btn{width:100%;padding:12px;background:#2b78e4;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
#btn:disabled{opacity:0.5;}
#clear{margin-top:10px;padding:10px;width:100%;border:none;background:#e9e9eb;border-radius:8px;cursor:pointer;}
#err{color:red;margin:10px 0;display:none;}
#res{margin-top:15px;padding:12px;background:#f7f8fa;border-radius:8px;white-space:pre-wrap;display:none;}
.footer{margin-top:30px;text-align:center;font-size:14px;}
</style>
</head>
<body>
<div class="box">
  <h1>AI释义器</h1>
  <div>至今剩余：<span id="quota">3 / 3</span></div>
  <textarea id="inp" placeholder="输入改写文本"></textarea>
  <button id="btn">意译</button>
  <button id="clear">清场</button>
  <div id="err"></div>
  <div id="res"></div>
  <div class="footer">
    <a href="https://wa.me/8619841322006" target="_blank">WhatsApp无限使用及API密钥 → WhatsApp聊天</a>
  </div>
</div>

<script>
const MAX = 3;
const btn = document.getElementById('btn');
const clearBtn = document.getElementById('clear');
const inp = document.getElementById('inp');
const quotaDom = document.getElementById('quota');
const errDom = document.getElementById('err');
const resDom = document.getElementById('res');

function getUsage(){
  try{
    let d = JSON.parse(localStorage.getItem("ai_para_usage")||'{"date":"","used":0}');
    const today = new Date().toDateString();
    if(d.date !== today) d = {date:today,used:0};
    return d;
  }catch{return {date:new Date().toDateString(),used:0};}
}
function save(u){localStorage.setItem("ai_para_usage",JSON.stringify(u));}
function updateQuota(){
  const u = getUsage();
  quotaDom.innerText = Math.max(0,MAX-u.used)+" / "+MAX;
}

btn.onclick = async function(){
  errDom.style.display='none';
  const text = inp.value.trim();
  if(!text){errDom.innerText="请输入文本";errDom.style.display='block';return;}
  const usage = getUsage();
  if(usage.used >= MAX){errDom.innerText="今日次数耗尽";errDom.style.display='block';return;}

  btn.disabled=true;btn.innerText="处理中…";
  resDom.style.display="block";resDom.innerText="AI正在生成…";
  try{
    const r = await fetch("/api/rewrite",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:text})
    });
        let data;
    try {
      data = await r.json();
    } catch(e) {
      throw new Error("服务器异常，请稍后再试");
    }
    if(!r.ok){throw new Error((data && data.error) || "请求失败");}

    usage.used++;save(usage);updateQuota();
    resDom.innerText = data.result;
  }catch(e){
    errDom.innerText=e.message;errDom.style.display='block';
    resDom.style.display="none";
  }finally{
    btn.disabled=false;btn.innerText="意译";
  }
};

clearBtn.onclick=function(){
  inp.value='';resDom.style.display='none';errDom.style.display='none';
};

updateQuota();
</script>
</body>
</html>
